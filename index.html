<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>Aslaniko On the Road</title>
  <meta name="theme-color" content="#7ec8f2">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Aslaniko">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <link rel="icon" href="icons/favicon.svg" type="image/svg+xml">
  <link rel="icon" href="icons/favicon-32.png" sizes="32x32" type="image/png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <canvas id="game"></canvas>

  <!-- Açılış: logo birkaç saniye görünür, dokununca ya da kendiliğinden yavaşça kaybolur -->
  <div id="splash" aria-label="Aslaniko On the Road">
    <img src="icons/logo.png" alt="Aslaniko On the Road">
  </div>

  <!-- Garaj: araç ve renk seçimi (açılış ekranı) -->
  <div id="garage" class="screen">
    <div id="vehicle-row" class="vehicle-row"></div>
    <button id="prev" class="arrow-btn left" aria-label="Önceki araç"><svg viewBox="0 0 24 24"><use href="#i-left"/></svg></button>
    <button id="next" class="arrow-btn right" aria-label="Sonraki araç"><svg viewBox="0 0 24 24"><use href="#i-right"/></svg></button>
    <div id="color-row" class="color-row"></div>
    <button id="album-btn" class="big-btn yellow corner-left" aria-label="Çıkartma albümü"><svg viewBox="0 0 24 24"><use href="#i-album"/></svg></button>
    <button id="go" class="big-btn green corner" aria-label="Haritaya git"><svg viewBox="0 0 24 24"><use href="#i-flag"/></svg></button>
  </div>

  <!-- Çıkartma albümü: bölümlerde zıplayarak bulunan gizli çıkartmalar -->
  <div id="album" class="screen hidden">
    <button id="album-close" class="back-btn" aria-label="Garaja dön"><svg viewBox="0 0 24 24"><use href="#i-left"/></svg></button>
    <div id="album-grid" class="album-grid"></div>
  </div>

  <!-- Bölüm haritası -->
  <div id="map" class="screen hidden">
    <button id="to-garage" class="back-btn" aria-label="Garaja dön"><svg viewBox="0 0 24 24"><use href="#i-left"/></svg></button>
    <div id="level-row" class="level-row"></div>
  </div>

  <!-- Oyun içi göstergeler -->
  <div id="hud" class="hidden">
    <div id="slots"></div>
    <div id="stars"><svg viewBox="0 0 24 24"><use href="#i-star"/></svg><span id="star-count">0</span></div>
  </div>

  <button id="horn" class="round-btn hidden" aria-label="Korna">
    <svg viewBox="0 0 24 24"><use href="#i-horn"/></svg>
  </button>
  <button id="jump" class="round-btn jump hidden" aria-label="Zıpla">
    <svg viewBox="0 0 24 24"><use href="#i-jump"/></svg>
  </button>
  <button id="turbo" class="round-btn turbo hidden" aria-label="Turbo">
    <svg viewBox="0 0 24 24"><use href="#i-turbo"/></svg>
  </button>
  <button id="home" class="back-btn home hidden" aria-label="Ana ekrana dön">
    <svg viewBox="0 0 24 24"><use href="#i-home"/></svg>
  </button>
  <!-- Yol ayrımı: üst yol (köprü) ya da düz yol -->
  <div id="path-pick" class="hidden">
    <button data-path="up" class="path-btn up" aria-label="Üst yol"><svg viewBox="0 0 24 24"><use href="#i-jump"/></svg></button>
    <button data-path="down" class="path-btn down" aria-label="Düz yol"><svg viewBox="0 0 24 24"><use href="#i-right"/></svg></button>
  </div>
  <div id="hint" class="hidden" aria-hidden="true">
    <svg viewBox="0 0 24 24"><use href="#i-hand"/></svg>
  </div>

  <!-- Ebeveyn düğmesi: 1 saniye basılı tut -->
  <button id="gear" aria-label="Ebeveyn ayarları">
    <svg class="ring" viewBox="0 0 44 44"><circle cx="22" cy="22" r="19"/></svg>
    <svg class="cog" viewBox="0 0 24 24"><use href="#i-gear"/></svg>
  </button>

  <!-- Bitiş ekranı -->
  <div id="finish" class="screen hidden">
    <div id="finish-word" aria-hidden="true"></div>
    <div id="trophy">
      <svg viewBox="0 0 64 64"><use href="#i-trophy"/></svg>
    </div>
    <div id="finish-stars"></div>
    <div class="row">
      <button id="again" class="big-btn green" aria-label="Tekrar"><svg viewBox="0 0 24 24"><use href="#i-again"/></svg></button>
      <button id="to-map" class="big-btn blue" aria-label="Haritaya dön"><svg viewBox="0 0 24 24"><use href="#i-map"/></svg></button>
    </div>
  </div>

  <!-- Ebeveyn paneli (yazılı, yetişkinler için) -->
  <div id="parent" class="hidden">
    <div class="panel">
      <h2>Ebeveyn ayarları</h2>
      <label class="opt"><span>Sesler</span><input type="checkbox" id="opt-sound"></label>
      <label class="opt"><span>Müzik</span><input type="checkbox" id="opt-music"></label>
      <label class="opt"><span>Sayı ve harfleri sesli oku</span><input type="checkbox" id="opt-voice"></label>
      <label class="opt"><span>Az hareket (süs animasyonları ve efektler durur)</span><input type="checkbox" id="opt-calm"></label>
      <label class="opt"><span>Tüm bölümler açık (normalde bölümler sırayla açılır)</span><input type="checkbox" id="opt-open"></label>
      <div class="opt"><span>Hız</span>
        <div class="seg">
          <button data-speed="slow">Yavaş</button>
          <button data-speed="normal">Orta</button>
        </div>
      </div>
      <p class="note">Bilgisayarda: sağ ok tuşu gaz, boşluk tuşu zıplama, Alt Gr turbo, H korna.<br>Oyun hiçbir kişisel bilgi toplamaz ve internete bağlanmaz. Ayarlar yalnızca bu cihazda saklanır.</p>
      <p class="credits">Oyun Tasarım: Dayko<br><span class="version">Aslaniko On the Road · v0.2</span></p>
      <div class="row">
        <button id="parent-menu" class="text-btn">Garaja dön</button>
        <button id="parent-close" class="text-btn primary">Kapat</button>
      </div>
    </div>
  </div>

  <!-- Simgeler -->
  <svg width="0" height="0" style="position:absolute">
    <defs>

      <symbol id="i-left" viewBox="0 0 24 24"><path d="M15.5 4.5 7 12l8.5 7.5z" fill="currentColor" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></symbol>
      <symbol id="i-right" viewBox="0 0 24 24"><path d="M8.5 4.5 17 12l-8.5 7.5z" fill="currentColor" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></symbol>
      <symbol id="i-jump" viewBox="0 0 24 24"><path d="M12 3.5 4.5 12H9v7.5h6V12h4.5z" fill="currentColor" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/></symbol>
      <symbol id="i-turbo" viewBox="0 0 24 24"><path d="M12 2.5c.6 3-1.8 4.6-1.8 7 0 1.3.9 2.2 1.9 2.2 1.4 0 2-1.2 1.7-3 2.6 1.6 4.7 4.4 4.7 7.6A6.5 6.5 0 0 1 12 22.5a6.5 6.5 0 0 1-6.5-6.2c0-4.8 4.1-7.4 6.5-13.8z" fill="#ffd23f" stroke="#fff" stroke-width="1.4" stroke-linejoin="round"/><path d="M12 13.5c1.8 1.4 3 2.8 3 4.6a3 3 0 0 1-6 0c0-1.7 1.4-2.8 3-4.6z" fill="#fff"/></symbol>
      <symbol id="i-home" viewBox="0 0 24 24"><path d="M3.5 11.5 12 4l8.5 7.5" stroke="currentColor" stroke-width="2.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M6 10.5V20h4.5v-5.5h3V20H18v-9.5L12 5.5z" fill="currentColor"/></symbol>
      <symbol id="i-flag" viewBox="0 0 24 24"><rect x="5" y="3" width="2.4" height="18.5" rx="1" fill="currentColor"/><path d="M7.4 4h12v9h-12z" fill="#fff"/><path d="M7.4 4h3v3h-3zM13.4 4h3v3h-3zM10.4 7h3v3h-3zM16.4 7h3v3h-3zM7.4 10h3v3h-3zM13.4 10h3v3h-3z" fill="#1d3346"/></symbol>

      <symbol id="i-again" viewBox="0 0 24 24"><path d="M12 5V2L7 6.5 12 11V8a5 5 0 1 1-5 5H4a8 8 0 1 0 8-8z" fill="currentColor"/></symbol>
      <symbol id="i-map" viewBox="0 0 24 24"><path d="M3 6.5 8.5 4l7 2.5L21 4v13.5L15.5 20l-7-2.5L3 20z" fill="currentColor"/><path d="M8.5 4v13.5M15.5 6.5V20" stroke="#1f6fc0" stroke-width="1.4"/></symbol>

      <symbol id="i-horn" viewBox="0 0 24 24"><path d="M3 9.5v5h3l6 4.5V5L6 9.5z" fill="currentColor"/><path d="M15.5 8.5a5 5 0 0 1 0 7M18.5 5.5a9 9 0 0 1 0 13" stroke="currentColor" stroke-width="2.2" fill="none" stroke-linecap="round"/></symbol>
      <symbol id="i-gear" viewBox="0 0 24 24"><path d="M19.4 13a7.5 7.5 0 0 0 0-2l2-1.6-2-3.4-2.4 1a7.3 7.3 0 0 0-1.7-1L15 3.5h-4l-.4 2.5a7.3 7.3 0 0 0-1.7 1l-2.4-1-2 3.4L6.6 11a7.5 7.5 0 0 0 0 2l-2 1.6 2 3.4 2.4-1a7.3 7.3 0 0 0 1.7 1l.4 2.5h4l.4-2.5a7.3 7.3 0 0 0 1.7-1l2.4 1 2-3.4zM12 15.5a3.5 3.5 0 1 1 0-7 3.5 3.5 0 0 1 0 7z" fill="currentColor"/></symbol>

        <rect x="28" y="35" width="8" height="10" fill="#e8a200"/>
        <rect x="19" y="45" width="26" height="9" rx="3" fill="#b5651d"/>
        <path d="m32 13 2.2 4.6 5 .6-3.7 3.4 1 5-4.5-2.5-4.5 2.5 1-5-3.7-3.4 5-.6z" fill="#fff6c8"/>
      </symbol>
      <symbol id="i-lock" viewBox="0 0 24 24"><rect x="5" y="10.5" width="14" height="10" rx="2.5" fill="currentColor"/><path d="M8.5 10.5V8a3.5 3.5 0 0 1 7 0v2.5" stroke="currentColor" stroke-width="2.4" fill="none"/></symbol>
      <symbol id="i-album" viewBox="0 0 24 24"><rect x="3.5" y="3" width="17" height="18" rx="2.5" fill="#fff"/><rect x="3.5" y="3" width="4" height="18" rx="1.5" fill="#ff8fa3"/><circle cx="12" cy="9.5" r="2.6" fill="#ffd23f"/><circle cx="16.5" cy="14.5" r="2.4" fill="#8fd3ff"/><path d="m11.5 13.5 1 2 2.2.3-1.6 1.5.4 2.2-2-1.1-2 1.1.4-2.2-1.6-1.5 2.2-.3z" fill="#a66cff"/></symbol>
      <symbol id="lv-orchard" viewBox="0 0 64 64"><path d="M32 18c-4-6-14-6-16 4-2 12 8 30 16 30s18-18 16-30c-2-10-12-10-16-4z" fill="#ff5a5f"/><path d="M32 18c0-5 2-9 6-11" stroke="#7a4a22" stroke-width="3" fill="none" stroke-linecap="round"/><ellipse cx="42" cy="12" rx="7" ry="3.5" fill="#4caf50" transform="rotate(-20 42 12)"/><ellipse cx="24" cy="26" rx="3" ry="5" fill="#fff" opacity=".5"/></symbol>
      <symbol id="lv-clouds" viewBox="0 0 64 64"><path d="M12 40a10 10 0 0 1 8-16 13 13 0 0 1 24-2 9 9 0 0 1 8 18z" fill="#fff"/><ellipse cx="22" cy="18" rx="6" ry="7.5" fill="#ff8fa3"/><ellipse cx="34" cy="12" rx="6" ry="7.5" fill="#ffd166"/><ellipse cx="46" cy="18" rx="6" ry="7.5" fill="#8fd3ff"/><path d="M22 25.5 30 40M34 19.5 32 40M46 25.5 34 40" stroke="#888" stroke-width="1.2"/><rect x="24" y="40" width="16" height="10" rx="3" fill="#e8333a"/></symbol>
      <symbol id="lv-dino" viewBox="0 0 64 64"><ellipse cx="26" cy="42" rx="16" ry="10" fill="#7bc47f"/><path d="M38 40c6-4 6-16 4-24" stroke="#7bc47f" stroke-width="7" fill="none" stroke-linecap="round"/><ellipse cx="46" cy="14" rx="8" ry="5.5" fill="#7bc47f"/><circle cx="48" cy="12.5" r="1.6" fill="#333"/><path d="M10 42 2 46" stroke="#7bc47f" stroke-width="6" stroke-linecap="round"/><rect x="16" y="48" width="5" height="8" fill="#5aa35e"/><rect x="30" y="48" width="5" height="8" fill="#5aa35e"/></symbol>
      <symbol id="lv-train" viewBox="0 0 64 64"><rect x="8" y="24" width="30" height="20" rx="3" fill="#ff6b6b"/><rect x="34" y="14" width="18" height="30" rx="3" fill="#e04f4f"/><rect x="38" y="18" width="10" height="9" rx="2" fill="#fff" opacity=".8"/><rect x="14" y="16" width="6" height="9" fill="#34404a"/><circle cx="16" cy="48" r="5" fill="#34404a"/><circle cx="30" cy="48" r="5" fill="#34404a"/><circle cx="44" cy="48" r="5" fill="#34404a"/><path d="M4 55h56" stroke="#7d8a93" stroke-width="3"/></symbol>

      <symbol id="lv-farm" viewBox="0 0 64 64"><path d="M12 30 32 14l20 16v22H12z" fill="#c8372d"/><path d="M8 32 32 12l24 20" stroke="#8f231c" stroke-width="5" fill="none" stroke-linejoin="round"/><rect x="25" y="36" width="14" height="16" fill="#fff"/><path d="M25 36l14 16M39 36 25 52" stroke="#c8372d" stroke-width="2.5"/></symbol>

  </svg>

  <script src="js/sound.js"></script>
  <script src="js/vehicles.js"></script>
  <script src="js/mechanics.js"></script>
  <script src="js/level.js"></script>
  <script src="js/themes.js"></script>
  <script src="js/game.js"></script>
</body>
</html>
